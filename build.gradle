plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Load the numbers for the chosen Minecraft version (-Pmc=26.3; default from gradle.properties).
def mcTarget = project.findProperty("mc") ?: "26.2"
def versionFile = file("versions/${mcTarget}.properties")
if (!versionFile.exists()) throw new GradleException("No versions/${mcTarget}.properties")
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k as String, v as String) }

version = "${project.version}+mc${project.minecraft_version}"

// Version-specific code (window/input library calls) lives in src/mc<version>/java.
sourceSets.main.java.srcDir "src/mc${mcTarget}/java"
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Fates Common, the library shared with Fates OFA (https://github.com/DontTemptFate/Fates_Common)
	maven {
		url "https://raw.githubusercontent.com/DontTemptFate/Fates_Common/maven"
		content { includeGroup "io.github.donttemptfate" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// bundled inside the jar; with Fates OFA also installed, Fabric Loader keeps the newer copy
	implementation "io.github.donttemptfate:fatescommon:${project.fates_common_version}+mc${project.minecraft_version}"
	include "io.github.donttemptfate:fatescommon:${project.fates_common_version}+mc${project.minecraft_version}"

	testImplementation "junit:junit:4.13.2"
	testImplementation "com.google.code.gson:gson:2.11.0"
}

fabricApi {
	// In-game smoke test (src/gametest), run in CI with ./gradlew runClientGametest
	configureTests {
		createSourceSet = true
		modId = "fatesflipper-test"
		enableGameTests = false
		eula = true
	}
}

processResources {
	def version = project.version
	def minecraftDep = project.minecraft_dep
	// at least the Fabric API this jar was built against: an older one gets a clear loader message
	// instead of a crash (audit F-C2)
	def fabricApiDep = ">=" + project.fabric_api_version.split("\\+")[0]
	def commonDep = ">=" + project.fates_common_version
	inputs.property "version", version
	inputs.property "minecraftDep", minecraftDep
	inputs.property "fabricApiDep", fabricApiDep
	inputs.property "commonDep", commonDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_dep": minecraftDep, "fabric_api_dep": fabricApiDep, "common_dep": commonDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnit()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

jar {
	// compile-time copies of Mod Menu's two interfaces (src/main/java/com/terraformersmc): never shipped,
	// the real ones come with Mod Menu when it's installed
	exclude "com/terraformersmc/**"
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
