name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the publish job writes (to the ci-results branch). Actions are pinned
# to exact commits (Dependabot keeps them current).
permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        id: build
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee build.log

      # Method signatures of the Minecraft classes the mod draws on, for development (no source access here).
      - name: API reference (javap)
        if: always()
        continue-on-error: true
        run: |
          jar=$(find ~/.gradle/caches .gradle -name '*.jar' -path '*minecraft*' 2>/dev/null | grep -iE 'client|merged' | grep -v sources | xargs ls -S 2>/dev/null | head -1)
          echo "jar: $jar" > api.txt
          unzip -Z1 "$jar" | grep -iE 'FontDescription|tooltip/|ChatScreen|HoverEvent' | head -80 >> api.txt
          for c in net.minecraft.client.gui.screens.ChatScreen net.minecraft.client.gui.GuiGraphicsExtractor \
                   net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.network.chat.Style \
                   net.minecraft.network.chat.FontDescription net.minecraft.client.gui.components.ChatComponent \
                   net.minecraft.client.gui.Font net.minecraft.client.gui.screens.inventory.tooltip.TooltipRenderUtil \
                   net.minecraft.client.gui.screens.inventory.tooltip.ClientTooltipComponent net.minecraft.client.gui.screens.Screen \
                   net.minecraft.client.gui.screens.inventory.tooltip.ClientTooltipPositioner \
                   net.minecraft.client.KeyMapping net.minecraft.client.Options \
                   com.mojang.blaze3d.platform.InputConstants 'com.mojang.blaze3d.platform.InputConstants$Type' \
                   net.minecraft.world.scores.Scoreboard net.minecraft.world.scores.PlayerScoreEntry \
                   net.minecraft.world.scores.PlayerTeam net.minecraft.world.scores.Objective \
                   net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.ChatComponent \
                   net.minecraft.client.multiplayer.chat.ChatListener net.minecraft.client.gui.Gui net.minecraft.client.CommandHistory \
                   net.minecraft.util.ArrayListDeque net.minecraft.client.gui.screens.ChatScreen \
                   net.minecraft.client.Minecraft net.minecraft.client.User net.minecraft.server.Services; do
            echo "=== $c" >> api.txt
            javap -p -cp "$jar" "$c" >> api.txt 2>&1 || true
          done
          auth=$(find ~/.gradle/caches -name 'authlib-*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "=== authlib: $auth" >> api.txt
          javap -cp "$auth" com.mojang.authlib.minecraft.MinecraftSessionService >> api.txt 2>&1 || true

      # 26.3 renders through SDL3 and needs a real (virtual) display with GL drivers on CI.
      - name: Virtual display for the game test
        if: steps.build.outcome == 'success' && matrix.mc != '26.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 mesa-vulkan-drivers > /dev/null

      - name: In-game smoke test (real Minecraft client)
        id: gametest
        if: steps.build.outcome == 'success'
        timeout-minutes: 12
        run: |
          set -o pipefail
          if [ "${{ matrix.mc }}" = "26.2" ]; then
            ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          else
            xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGametest -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee gametest.log
          fi

      - name: Collect results
        if: always()
        run: |
          out=out/mc${{ matrix.mc }}
          mkdir -p "$out/screenshots"
          cp build.log "$out/" 2>/dev/null || echo "no build log" > "$out/build.log"
          cp gametest.log "$out/" 2>/dev/null || true
          cp api.txt "$out/" 2>/dev/null || true
          cp build/run/clientGameTest/screenshots/*.png "$out/screenshots/" 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log "$out/client-latest.log" 2>/dev/null || true
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar) ;; *) [ -f "$f" ] && cp "$f" "$out/" ;; esac
          done
          {
            echo "result=${{ steps.build.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
          } > "$out/RESULT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fatesflipper-mc${{ matrix.mc }}
          path: out/mc${{ matrix.mc }}

  # Publishes every version's jar, logs and screenshots to the `ci-results` branch, so the result
  # can be read with plain git. Only for pushes to main.
  publish:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/ci
      - name: Push to ci-results
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/ci
          {
            echo "sha=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for d in */; do echo "[${d%/}]"; cat "$d/RESULT" 2>/dev/null || echo "result=missing"; done
          } > RESULT
          git init -q -b ci-results
          git config user.name "fates-flipper-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
