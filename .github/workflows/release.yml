name: Release

# Publish a release either way:
#   - Actions → Release → "Run workflow" on main: releases the `version` in gradle.properties and
#     creates its tag (v<version>; a version with -beta.N is a pre-release), or
#   - push a tag like v0.4.0 (or v0.4.0-beta.1).
# Then:
#   1. builds and tests both jars (26.2, 26.3); the tag must match `version` in gradle.properties
#   2. GitHub Release with both jars, SHA256SUMS.txt and the changelog (this version's section of
#      CHANGELOG.md, else the commits since the last tag); betas are marked pre-release
#   3. Modrinth upload, only when the repository has the secret MODRINTH_TOKEN and the variable
#      MODRINTH_PROJECT_ID (Settings → Secrets and variables → Actions). Without them this step is
#      skipped and the GitHub Release is the download.
# Nothing here runs on normal pushes; build.yml keeps testing every push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Tag matches the mod version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version=$VERSION in gradle.properties"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released; bump version in gradle.properties first"
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/fatesflipper-*+mc${{ matrix.mc }}.jar
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      beta: ${{ steps.meta.outputs.beta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and changelog
        id: meta
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-beta*|*-b.*) echo "beta=true" >> "$GITHUB_OUTPUT";; *) echo "beta=false" >> "$GITHUB_OUTPUT";; esac
          (cd dist && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "## Fates Flipper ${TAG#v}"
            echo
            echo "One jar per Minecraft version: \`+mc26.2\` or \`+mc26.3\`. Needs Fabric Loader 0.19.3+ and Fabric API."
            echo "Check the download against \`SHA256SUMS.txt\`. Display only: the mod never clicks or buys for you."
            echo
            echo "### Changes"
            # the hand-written section for this version in CHANGELOG.md; else the commits since the last tag
            SECTION=$(awk -v v="${TAG#v}" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md 2>/dev/null | sed '/./,$!d')
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_SHA}"; else RANGE="${GITHUB_SHA}"; fi
              git log --no-merges --format='- %s' "$RANGE" | grep -v -iE '^- (ci|chore|merge)' | head -60
            fi
          } > NOTES.md
          cat NOTES.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FLAGS=""
          if [ "${{ steps.meta.outputs.beta }}" = "true" ]; then FLAGS="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file NOTES.md $FLAGS
          else
            gh release create "$TAG" dist/*.jar dist/SHA256SUMS.txt --target "${GITHUB_SHA}" --title "Fates Flipper ${TAG#v}" --notes-file NOTES.md $FLAGS
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: NOTES.md

  modrinth:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Modrinth set up?
        id: check
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$PROJECT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MODRINTH_TOKEN / MODRINTH_PROJECT_ID: skipping Modrinth (the GitHub Release is published)."
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.ok == 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Upload one version per Minecraft release
        if: steps.check.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BETA: ${{ needs.github-release.outputs.beta }}
        run: |
          set -e
          TYPE=release; [ "$BETA" = "true" ] && TYPE=beta
          CHANGELOG=$(sed -n '/^### Changes/,$p' dist/NOTES.md 2>/dev/null || echo "")
          for JAR in dist/fatesflipper-*.jar; do
            MC=$(basename "$JAR" .jar | sed -E 's/.*\+mc//')
            VER=$(basename "$JAR" .jar | sed -E 's/^fatesflipper-//')
            # Fabric API on Modrinth: project P7dR8mSH
            DATA=$(jq -n --arg name "Fates Flipper ${TAG#v} for $MC" --arg ver "$VER" --arg mc "$MC" \
              --arg type "$TYPE" --arg project "$PROJECT" --arg log "$CHANGELOG" \
              '{name:$name, version_number:$ver, changelog:$log, game_versions:[$mc], version_type:$type,
                loaders:["fabric"], featured:false, project_id:$project, file_parts:["jar"],
                dependencies:[{project_id:"P7dR8mSH", dependency_type:"required"}]}')
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: $TOKEN" -H "User-Agent: DontTemptFate/Fates_Flipper release" \
              -F "data=$DATA" -F "jar=@$JAR;type=application/java-archive")
            echo "$JAR → Modrinth $code"
            if [ "$code" -ge 300 ]; then cat resp.json; exit 1; fi
          done
